name: Release

# 平时推 main 不触发发布；要发版时把 main 推到 release 分支：
#   git push origin main:release
# workflow_dispatch 只跑构建、不发布，用来验证打包链路。
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller ruff

      - name: Run the regression suite
        run: |
          python -B -m unittest discover -s tests
          ruff check vocaloidtts tests

      - name: Build the onedir bundle
        run: python -m PyInstaller --noconfirm --clean VocaloidTTS.spec

      - name: Smoke-test the packaged exe
        shell: pwsh
        run: |
          $exe = "dist\VocaloidTTS\VocaloidTTS.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no exe" }
          Remove-Item "$env:TEMP\VocaloidTTS_selftest.ok" -ErrorAction SilentlyContinue
          # console=False 的 GUI 程序用 & 调用时 PowerShell 不会等待，
          # $LASTEXITCODE 拿不到真实退出码；必须显式 -Wait。
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "selftest exited with $($proc.ExitCode)" }
          if (-not (Test-Path "$env:TEMP\VocaloidTTS_selftest.ok")) {
            throw "selftest produced no .ok file"
          }
          Get-Content "$env:TEMP\VocaloidTTS_selftest.ok"

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path vocaloidtts\__init__.py -Pattern '__version__').Line.Split('"')[1]
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Output "packaging VocaloidTTS_v$version"

      - name: Package the zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $name = "VocaloidTTS_v$version"
          New-Item -ItemType Directory -Force dist\pack | Out-Null
          Copy-Item dist\VocaloidTTS "dist\pack\$name" -Recurse
          Copy-Item "README_快速开始.txt" "dist\pack\$name\"
          Copy-Item "启动 VocaloidTTS.bat" "dist\pack\$name\"
          Compress-Archive -Path "dist\pack\$name" -DestinationPath "dist\$name.zip"
          Get-Item "dist\$name.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VocaloidTTS-windows
          path: dist/*.zip
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VocaloidTTS-windows
          path: dist

      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ needs.build.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 新版本：建 tag 和 Release，正文用自动生成的 changelog。
      - uses: softprops/action-gh-release@v2
        if: steps.exists.outputs.exists == 'false'
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: VocaloidTTS ${{ needs.build.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false

      # 同一版本重推 release 分支：只换产物，保留手写的发布说明。
      - name: Replace the asset on the existing release
        if: steps.exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.build.outputs.version }}" dist/*.zip --clobber
          echo "v${{ needs.build.outputs.version }} already released; asset replaced, notes kept."
