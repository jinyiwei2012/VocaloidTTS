name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller ruff

      - name: Run the regression suite
        run: |
          python -B -m unittest discover -s tests
          ruff check vocaloidtts tests

      - name: Build the onedir bundle
        run: python -m PyInstaller --noconfirm --clean VocaloidTTS.spec

      - name: Smoke-test the packaged exe
        shell: pwsh
        run: |
          $exe = "dist\VocaloidTTS\VocaloidTTS.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no exe" }
          Remove-Item "$env:TEMP\VocaloidTTS_selftest.ok" -ErrorAction SilentlyContinue
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest exited with $LASTEXITCODE" }
          if (-not (Test-Path "$env:TEMP\VocaloidTTS_selftest.ok")) {
            throw "selftest produced no .ok file"
          }
          Get-Content "$env:TEMP\VocaloidTTS_selftest.ok"

      - name: Package the zip
        shell: pwsh
        run: |
          $version = (Select-String -Path vocaloidtts\__init__.py -Pattern '__version__').Line.Split('"')[1]
          $name = "VocaloidTTS_v$version"
          Write-Output "packaging $name"
          New-Item -ItemType Directory -Force dist\pack | Out-Null
          Copy-Item dist\VocaloidTTS "dist\pack\$name" -Recurse
          Copy-Item "README_快速开始.txt" "dist\pack\$name\"
          Copy-Item "启动 VocaloidTTS.bat" "dist\pack\$name\"
          Compress-Archive -Path "dist\pack\$name" -DestinationPath "dist\$name.zip"
          Get-Item "dist\$name.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VocaloidTTS-windows
          path: dist/*.zip
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VocaloidTTS-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
