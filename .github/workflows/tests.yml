name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt ruff
      - run: python -B -m unittest discover -s tests -v
      - run: ruff check vocaloidtts tests
      - run: python VocaloidTTS.py --selftest
      - name: Check selftest output
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:TEMP\VocaloidTTS_selftest.ok")) {
            throw "selftest did not produce an .ok file"
          }
          Get-Content "$env:TEMP\VocaloidTTS_selftest.ok"
